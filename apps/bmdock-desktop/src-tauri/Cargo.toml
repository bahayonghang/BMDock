[package]
name = "bmdock-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmcp = { version = "=3.2.0", default-features = false, features = ["client", "transport-async-rw"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-std", "io-util", "time", "sync"] }
