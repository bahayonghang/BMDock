[package]
name = "bmdock-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rmcp = { version = "=3.2.0", default-features = false, features = ["client", "transport-async-rw"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-std", "io-util", "time"] }
